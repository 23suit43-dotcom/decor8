<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    .popup { display:flex; justify-content:center; align-items:center; height:100vh; }
    .popup-content {
      background:white; padding:2rem; border-radius:10px; width:320px;
      box-shadow:0 4px 15px rgba(0,0,0,0.3);
    }
    .popup h2 { margin-top:0; text-align:center; }
    .popup input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    .popup button {
      width:100%; padding:10px; margin-top:10px;
      background:#764ba2; color:white; border:none; border-radius:5px; cursor:pointer;
    }
    .popup button:hover { opacity:0.9; }
    .toggle-link { color:#667eea; cursor:pointer; font-size:14px; display:block; margin-top:10px; text-align:center; }
    .notification {
      position: fixed; top: 20px; right: 20px; padding: 12px 18px;
      background:#2ecc71; color:white; border-radius:8px; display:none; z-index:1000;
    }
    .notification.error { background:#e74c3c; }
  </style>
</head>
<body>

<div class="notification" id="notification"></div>

<div id="loginPopup" class="popup">
  <div class="popup-content">
    <h2 id="formTitle">Login</h2>

    <!-- Login Form -->
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="loginUserHandler()">Login</button>
      <span class="toggle-link" onclick="switchToRegister()">Don’t have an account? Register</span>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <input type="text" id="regName" placeholder="Full Name">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPassword" placeholder="Password">
      <button onclick="registerUserHandler()">Register</button>
      <span class="toggle-link" onclick="switchToLogin()">Already have an account? Login</span>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut,
      onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
    authDomain: "decor8-b14e8.firebaseapp.com",
    projectId: "decor8-b14e8",
    storageBucket: "decor8-b14e8.appspot.com",
    messagingSenderId: "301302844702",
    appId: "1:301302844702:web:7376ed27571e8d40cccd0f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function showNotification(msg, success=true){
    const note=document.getElementById("notification");
    note.textContent=msg;
    note.className = success ? "notification" : "notification error";
    note.style.display="block";
    setTimeout(()=>{ note.style.display="none"; },3000);
  }

  // 🔹 LOGIN FUNCTION
  window.loginUserHandler = async function(){
    const email=document.getElementById("loginEmail").value;
    const password=document.getElementById("loginPassword").value;
    try{
      await signInWithEmailAndPassword(auth,email,password);
      showNotification("Login successful!");
      setTimeout(()=> window.location.href="products.html",1000);
    }catch(err){
      console.error("Login Error:",err);
      let msg="Login failed: ";
      if(err.code==="auth/user-not-found") msg+="No account found. Please register.";
      else if(err.code==="auth/wrong-password") msg+="Incorrect password.";
      else if(err.code==="auth/invalid-email") msg+="Invalid email format.";
      else msg+=err.message;
      showNotification(msg,false);
    }
  }

  // 🔹 REGISTER FUNCTION (auto login + prefill login form)
  window.registerUserHandler = async function(){
    const name=document.getElementById("regName").value;
    const email=document.getElementById("regEmail").value;
    const password=document.getElementById("regPassword").value;
    try{
      await createUserWithEmailAndPassword(auth,email,password);
      showNotification("Registered & logged in successfully!");
      // Auto-fill login fields
      document.getElementById("loginEmail").value=email;
      document.getElementById("loginPassword").value=password;
      switchToLogin();
      setTimeout(()=> window.location.href="products.html",1000);
    }catch(err){
      console.error("Register Error:",err);
      let msg="Registration failed: ";
      if(err.code==="auth/email-already-in-use") msg+="Email already registered. Please login.";
      else if(err.code==="auth/weak-password") msg+="Password should be at least 6 characters.";
      else msg+=err.message;
      showNotification(msg,false);
      if(err.code==="auth/email-already-in-use"){
        switchToLogin();
        document.getElementById("loginEmail").value=email;
      }
    }
  }

  // 🔹 Switch Forms
  window.switchToRegister=function(){
    document.getElementById("loginForm").style.display="none";
    document.getElementById("registerForm").style.display="block";
    document.getElementById("formTitle").innerText="Register";
  }
  window.switchToLogin=function(){
    document.getElementById("registerForm").style.display="none";
    document.getElementById("loginForm").style.display="block";
    document.getElementById("formTitle").innerText="Login";
  }

  // 🔹 Logout function (optional use on navbar)
  window.logoutUserHandler=async function(){
    try{ await signOut(auth); showNotification("Logged out"); }
    catch(err){ showNotification("Logout error: "+err.message,false); }
  }

  // 🔹 Auto-redirect if already logged in
  onAuthStateChanged(auth,(user)=>{
    if(user){
      console.log("Already logged in:",user.email);
      // If user is on login page, redirect directly
      if(window.location.pathname.includes("login.html")){
        setTimeout(()=> window.location.href="products.html",1000);
      }
    }
  });
</script>
</body>
</html>
