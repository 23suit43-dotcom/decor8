<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login/Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f8f9fa; margin:0; }
    .popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000; }
    .popup-content { background:white; padding:2rem; border-radius:10px; width:350px; position:relative; }
    .popup h2 { text-align:center; }
    .popup input[type="text"], .popup input[type="email"], .popup input[type="password"] { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    .popup button { width:100%; padding:12px; margin-top:10px; background:#764ba2; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; font-weight:500; }
    .popup button:hover { opacity:0.9; }
    .popup .close { position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; color:#666; }
    .popup .close:hover { color:#000; }
    .toggle-link { text-align:center; display:block; margin-top:10px; color:#667eea; cursor:pointer; font-size:14px; }
    .toggle-link:hover { text-decoration:underline; }
    .password-box { position:relative; }
    .toggle-password { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:13px; color:#667eea; }
    .toggle-password:hover { text-decoration:underline; }
    .remember { display:flex; align-items:center; font-size:14px; margin:10px 0; }
    .remember input { margin-right:6px; }
    .loader { border:3px solid #f3f3f3; border-radius:50%; border-top:3px solid #764ba2; width:20px; height:20px; animation:spin 1s linear infinite; margin:10px auto; display:none; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .error-message { color:red; padding:10px; margin:10px 0; border:1px solid red; border-radius:5px; }
  </style>
</head>
<body>

<!-- Popup Login/Register -->
<div id="loginPopup" class="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">&times;</span>
    <h2 id="formTitle">Login</h2>

    <!-- Login Form -->
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <div class="password-box">
        <input type="password" id="loginPassword" placeholder="Password" required>
        <span class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</span>
      </div>
      <label class="remember"><input type="checkbox" id="rememberMe"> Remember Me</label>
      <button onclick="loginUser()" id="loginBtn">Login</button>
      <div class="loader" id="loginLoader"></div>
      <span class="toggle-link" onclick="switchToRegister()">Don't have an account? Register</span>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <input type="text" id="regName" placeholder="Full Name" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <div class="password-box">
        <input type="password" id="regPassword" placeholder="Password (min. 6 characters)" required minlength="6">
        <span class="toggle-password" onclick="togglePassword('regPassword', this)">Show</span>
      </div>
      <button onclick="registerUser()" id="registerBtn">Register</button>
      <div class="loader" id="registerLoader"></div>
      <span class="toggle-link" onclick="switchToLogin()">Already have an account? Login</span>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  signOut, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

// 🔑 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
  authDomain: "decor8-b14e8.firebaseapp.com",
  projectId: "decor8-b14e8",
  storageBucket: "decor8-b14e8.appspot.com",
  messagingSenderId: "301302844702",
  appId: "1:301302844702:web:7376ed27571e8d40cccd0f",
  measurementId: "G-NGJ1DN3SCY"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Popup functions
function closePopup(){ document.getElementById('loginPopup').style.display='none'; }
function switchToRegister(){ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; document.getElementById('formTitle').innerText='Register'; }
function switchToLogin(){ document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; document.getElementById('formTitle').innerText='Login'; }
function togglePassword(id,el){ const input=document.getElementById(id); if(input.type==='password'){ input.type='text'; el.innerText='Hide'; } else { input.type='password'; el.innerText='Show'; } }
function showNotification(message, isSuccess=true){ alert(message); } // simple alert for now
function showLoader(show,type='login'){ document.getElementById(type==='login'?'loginLoader':'registerLoader').style.display = show?'block':'none'; document.getElementById(type==='login'?'loginBtn':'registerBtn').style.display = show?'none':'block'; }

// Auto-fill remembered email
window.addEventListener('load', () => {
  const rememberedUser = localStorage.getItem("rememberedUser");
  if(rememberedUser){
    document.getElementById("loginEmail").value = rememberedUser;
    document.getElementById("rememberMe").checked = true;
  }
});

// Login
async function loginUser(){
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const remember = document.getElementById("rememberMe").checked;

  if(!email || !password){ showNotification("Enter email and password",false); return; }
  showLoader(true,'login');

  try{
    const userCredential = await signInWithEmailAndPassword(auth,email,password);

    if(remember){
      localStorage.setItem("rememberedUser", email);
    } else {
      localStorage.removeItem("rememberedUser");
    }

    closePopup();
    showNotification("Login successful!");
  } catch(e){
    console.error(e);
    let msg="Login failed";
    if(e.code==="auth/user-not-found") msg="No account found";
    else if(e.code==="auth/wrong-password") msg="Incorrect password";
    showNotification(msg,false);
  } finally { showLoader(false,'login'); }
}

// Register
async function registerUser(){
  const name = document.getElementById("regName").value;
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;

  if(!name || !email || !password){ showNotification("Fill all fields",false); return; }
  if(password.length<6){ showNotification("Password too short",false); return; }

  showLoader(true,'register');
  try{
    await createUserWithEmailAndPassword(auth,email,password);
    showNotification("Registration successful! Please login.");
    switchToLogin();
  } catch(e){
    console.error(e);
    let msg="Registration failed";
    if(e.code==="auth/email-already-in-use") msg="Email already registered";
    showNotification(msg,false);
  } finally{ showLoader(false,'register'); }
}

// Logout
async function logoutUser(){
  try{
    await signOut(auth);
    localStorage.removeItem("rememberedUser");
    showNotification("Logged out successfully!");
  } catch(e){ console.error(e); showNotification("Logout failed",false); }
}

// Make globally available
window.loginUser=loginUser;
window.registerUser=registerUser;
window.logoutUser=logoutUser;
window.closePopup=closePopup;
window.switchToRegister=switchToRegister;
window.switchToLogin=switchToLogin;
window.togglePassword=togglePassword;

// Close popup by clicking outside
window.addEventListener('click',function(event){
  const popup = document.getElementById('loginPopup');
  if(event.target === popup) closePopup();
});
</script>
</body>
</html>
