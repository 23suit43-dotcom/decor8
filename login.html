<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
    .popup { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .popup-content {
      background: #fff; padding: 2rem; border-radius: 10px;
      width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    button {
      width: 100%; padding: 10px; margin-top: 10px;
      background: #764ba2; color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .toggle-link { color: #667eea; cursor: pointer; font-size: 14px; display: block; margin-top: 10px; text-align: center; }
    .notification {
      position: fixed; top: 20px; right: 20px;
      padding: 12px 16px; border-radius: 8px;
      background: #2ecc71; color: #fff; display: none; z-index: 1000;
    }
    .notification.error { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <div id="loginPopup" class="popup">
    <div class="popup-content">
      <h2 id="formTitle">Login</h2>

      <!-- Login Form -->
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="loginUser()">Login</button>
        <span class="toggle-link" onclick="switchToRegister()">Don't have an account? Register</span>
        <span class="toggle-link" onclick="resetPassword()">Forgot Password?</span>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <button onclick="registerUser()">Register</button>
        <span class="toggle-link" onclick="switchToLogin()">Already have an account? Login</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendPasswordResetEmail, updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
      authDomain: "decor8-b14e8.firebaseapp.com",
      projectId: "decor8-b14e8",
      storageBucket: "decor8-b14e8.appspot.com",
      messagingSenderId: "301302844702",
      appId: "1:301302844702:web:7376ed27571e8d40cccd0f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Notification helper
    function notify(msg, success=true) {
      const n = document.getElementById("notification");
      n.textContent = msg;
      n.className = success ? "notification" : "notification error";
      n.style.display = "block";
      setTimeout(()=> n.style.display="none", 3000);
    }

    // Login
    window.loginUser = async function() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "products.html";
      } catch (err) {
        notify("Login failed: " + err.message, false);
      }
    };

    // Register (auto login)
    window.registerUser = async function() {
      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCred.user, { displayName: name });
        window.location.href = "products.html";
      } catch (err) {
        notify("Registration failed: " + err.message, false);
      }
    };

    // Forget Password
    window.resetPassword = async function() {
      const email = document.getElementById("loginEmail").value;
      if (!email) { notify("Enter your email to reset password", false); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        notify("Password reset email sent!");
      } catch (err) {
        notify("Error: " + err.message, false);
      }
    };

    // Switch forms
    window.switchToRegister = () => {
      document.getElementById("loginForm").style.display="none";
      document.getElementById("registerForm").style.display="block";
      document.getElementById("formTitle").innerText="Register";
    };
    window.switchToLogin = () => {
      document.getElementById("registerForm").style.display="none";
      document.getElementById("loginForm").style.display="block";
      document.getElementById("formTitle").innerText="Login";
    };
  </script>
</body>
</html>
