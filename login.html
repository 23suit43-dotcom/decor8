<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      max-width: 1000px;
      width: 90%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      overflow: hidden;
      min-height: 600px;
    }

    .hero-section {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-section h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .hero-section p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .form-section {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-container {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
      font-weight: 300;
      font-size: 2rem;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e1e1e1;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 12px;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forgot-password {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .switch-form {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .switch-form span {
      color: #667eea;
      cursor: pointer;
      text-decoration: underline;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      background: #2ecc71;
      color: white;
      border-radius: 8px;
      display: none;
      z-index: 1000;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .notification.error {
      background: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <div class="container">
    <div class="hero-section">
      <h1>Transform Your Home with Style</h1>
      <p>The perfect blend of modern furniture and elegant decor ideas to make your space unique and comfortable.</p>
    </div>

    <div class="form-section">
      <div class="form-container">
        <!-- Login Form -->
        <div id="loginForm">
          <h2>Login</h2>
          <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email">
          </div>
          <div class="input-group password-container">
            <input type="password" id="loginPassword" placeholder="Password">
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
          </div>
          <div class="remember-forgot">
            <div class="remember-me">
              <input type="checkbox" id="rememberMe">
              <label for="rememberMe">Remember me</label>
            </div>
            <a class="forgot-password" onclick="openForgotPassword()">Forgot Password?</a>
          </div>
          <button class="btn" onclick="loginUserHandler()">Login</button>
          <div class="switch-form">
            Don't have an account? <span onclick="switchToRegister()">Register</span>
          </div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none;">
          <h2>Register</h2>
          <div class="input-group">
            <input type="text" id="regName" placeholder="Full Name">
          </div>
          <div class="input-group">
            <input type="email" id="regEmail" placeholder="Email">
          </div>
          <div class="input-group password-container">
            <input type="password" id="regPassword" placeholder="Password">
            <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">Show</button>
          </div>
          <button class="btn" onclick="registerUserHandler()">Register</button>
          <div class="switch-form">
            Already have an account? <span onclick="switchToLogin()">Login</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase with Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendPasswordResetEmail, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { 
      getFirestore, doc, setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
      authDomain: "decor8-b14e8.firebaseapp.com",
      projectId: "decor8-b14e8",
      storageBucket: "decor8-b14e8.appspot.com",
      messagingSenderId: "301302844702",
      appId: "1:301302844702:web:7376ed27571e8d40cccd0f",
      measurementId: "G-NGJ1DN3SCY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function showNotification(message, isSuccess = true) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = isSuccess ? 'notification' : 'notification error';
      notification.style.display = 'block';
      setTimeout(() => { notification.style.display = 'none'; }, 3000);
    }

    // Save user to Firestore
    async function saveUserToFirestore(userId, userData) {
      try {
        await setDoc(doc(db, "users", userId), {
          name: userData.name,
          email: userData.email,
          createdAt: new Date(),
          lastLogin: new Date()
        });
        console.log("User saved to Firestore");
      } catch (error) {
        console.error("Error saving user to Firestore:", error);
      }
    }

    // Login function
    window.loginUserHandler = async function() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      
      if (!email || !password) {
        showNotification("Please enter both email and password", false);
        return;
      }
      
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        showNotification("Login successful! Redirecting...");
        
        // Update last login in Firestore
        await setDoc(doc(db, "users", userCredential.user.uid), {
          lastLogin: new Date()
        }, { merge: true });
        
        setTimeout(() => {
          window.location.href = "products.html";
        }, 1500);
        
      } catch (error) {
        console.error("Login error:", error);
        if (error.code === "auth/invalid-credential") {
          showNotification("Invalid email or password", false);
        } else if (error.code === "auth/user-not-found") {
          showNotification("No account found. Please register first.", false);
        } else {
          showNotification("Login failed: " + error.message, false);
        }
      }
    };

    // Register function
    window.registerUserHandler = async function() {
      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      
      if (!name || !email || !password) {
        showNotification("Please fill in all fields", false);
        return;
      }
      
      if (password.length < 6) {
        showNotification("Password should be at least 6 characters", false);
        return;
      }
      
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Set display name
        await updateProfile(userCredential.user, {
          displayName: name
        });
        
        // Save user to Firestore
        await saveUserToFirestore(userCredential.user.uid, {
          name: name,
          email: email
        });
        
        showNotification("Registration successful! Please login.");
        switchToLogin();
        document.getElementById("loginEmail").value = email;
        
      } catch (error) {
        console.error("Register error:", error);
        if (error.code === "auth/email-already-in-use") {
          showNotification("Email already registered. Please login.", false);
          switchToLogin();
          document.getElementById("loginEmail").value = email;
        } else {
          showNotification("Registration failed: " + error.message, false);
        }
      }
    };

    // Forgot password
    window.openForgotPassword = async function() {
      const email = document.getElementById("loginEmail").value;
      const userEmail = prompt("Enter your email address to reset password:", email || "");
      
      if (!userEmail) return;
      
      try {
        await sendPasswordResetEmail(auth, userEmail);
        showNotification("Password reset email sent! Check your inbox.");
      } catch (error) {
        showNotification("Error: " + error.message, false);
      }
    };

    // Switch forms
    window.switchToRegister = function() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "block";
    };

    window.switchToLogin = function() {
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    };

    // Toggle password
    window.togglePassword = function(inputId, el) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        el.textContent = "Hide";
      } else {
        input.type = "password";
        el.textContent = "Show";
      }
    };

    // Auto redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        showNotification("Welcome back! Redirecting...");
        setTimeout(() => {
          window.location.href = "products.html";
        }, 1000);
      }
    });

    console.log("Decor8 with Firestore loaded!");
  </script>
</body>
</html>
