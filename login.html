<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    .popup {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background: #f0f0f0;
    }
    .popup-content {
      background: white; padding: 2rem; border-radius: 10px; width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: left;
    }
    .popup h2 { text-align: center; margin-bottom: 1rem; }
    .popup input[type="text"], .popup input[type="password"], .popup input[type="email"] {
      width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px;
    }
    .popup button {
      width: 100%; padding: 10px; margin-top: 10px;
      background: #764ba2; color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .popup button:hover { opacity: 0.9; }
    .toggle-link { color: #667eea; cursor: pointer; font-size: 14px; display: block; margin-top: 10px; text-align: center; }
    .password-box { position: relative; }
    .toggle-password {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 13px; color: #667eea;
    }
    .notification {
      position: fixed; top: 20px; right: 20px; padding: 15px 20px;
      background: #2ecc71; color: white; border-radius: 8px; display: none; z-index: 1000;
    }
    .notification.error { background: #e74c3c; }
    
    /* Forgot Password Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1001;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: white;
      margin: 15% auto;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal">
    <div class="modal-content">
      <h3>Reset Password</h3>
      <p>Enter your email address and we'll send you a password reset link.</p>
      <input type="email" id="resetEmail" placeholder="Your email" style="width: 100%; padding: 8px; margin: 10px 0;">
      <div class="modal-buttons">
        <button onclick="closeModal()" style="background: #ccc;">Cancel</button>
        <button onclick="sendResetEmail()" style="background: #764ba2; color: white;">Send Reset Link</button>
      </div>
    </div>
  </div>

  <div id="loginPopup" class="popup">
    <div class="popup-content">
      <h2 id="formTitle">Login</h2>

      <!-- Login Form -->
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <div class="password-box">
          <input type="password" id="loginPassword" placeholder="Password">
          <span class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</span>
        </div>
        <button onclick="loginUserHandler()" id="loginButton">Login</button>
        <span class="toggle-link" onclick="openForgotPasswordModal()">Forgot Password?</span>
        <span class="toggle-link" onclick="switchToRegister()">Don't have an account? Register</span>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <div class="password-box">
          <input type="password" id="regPassword" placeholder="Password">
          <span class="toggle-password" onclick="togglePassword('regPassword', this)">Show</span>
        </div>
        <button onclick="registerUserHandler()" id="registerButton">Register</button>
        <span class="toggle-link" onclick="switchToLogin()">Already have an account? Login</span>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendPasswordResetEmail, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
      authDomain: "decor8-b14e8.firebaseapp.com",
      projectId: "decor8-b14e8",
      storageBucket: "decor8-b14e8.appspot.com",
      messagingSenderId: "301302844702",
      appId: "1:301302844702:web:7376ed27571e8d40cccd0f",
      measurementId: "G-NGJ1DN3SCY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showNotification(message, isSuccess = true) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = isSuccess ? 'notification' : 'notification error';
      notification.style.display = 'block';
      setTimeout(() => { notification.style.display = 'none'; }, 3000);
    }

    // Login function
    window.loginUserHandler = async function() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      
      if (!email || !password) {
        showNotification("Please enter both email and password", false);
        return;
      }
      
      const loginButton = document.getElementById("loginButton");
      const originalText = loginButton.textContent;
      loginButton.textContent = "Logging in...";
      loginButton.disabled = true;
      
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        showNotification("Login successful! Redirecting...");
        console.log("Logged in:", userCredential.user.email);
        
        // Redirect to products page
        setTimeout(() => {
          window.location.href = "products.html";
        }, 1500);
        
      } catch (error) {
        console.error("Login error:", error.code, error.message);
        loginButton.textContent = originalText;
        loginButton.disabled = false;
        
        if (error.code === "auth/invalid-credential") {
          showNotification("Invalid email or password. Please try again.", false);
        } else if (error.code === "auth/user-not-found") {
          showNotification("No account found with this email. Please register first.", false);
          // Auto-switch to register form
          switchToRegister();
          document.getElementById("regEmail").value = email;
        } else if (error.code === "auth/wrong-password") {
          showNotification("Incorrect password. Please try again or use 'Forgot Password'.", false);
        } else {
          showNotification("Login error: " + error.message, false);
        }
      }
    };

    // Register function
    window.registerUserHandler = async function() {
      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      
      if (!name || !email || !password) {
        showNotification("Please fill in all fields", false);
        return;
      }
      
      if (password.length < 6) {
        showNotification("Password should be at least 6 characters", false);
        return;
      }
      
      const registerButton = document.getElementById("registerButton");
      const originalText = registerButton.textContent;
      registerButton.textContent = "Registering...";
      registerButton.disabled = true;
      
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Set display name for the user
        await updateProfile(userCredential.user, {
          displayName: name
        });
        
        showNotification("Registration successful! Logging you in...");
        console.log("Registered:", userCredential.user.email);
        
        // Auto-login after registration
        setTimeout(async () => {
          try {
            await signInWithEmailAndPassword(auth, email, password);
            showNotification("Login successful! Redirecting...");
            setTimeout(() => {
              window.location.href = "products.html";
            }, 1000);
          } catch (loginError) {
            console.error("Auto-login error:", loginError);
            showNotification("Registered! Please login manually.", true);
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = password;
            switchToLogin();
          }
        }, 500);
        
      } catch (error) {
        console.error("Register error:", error.code, error.message);
        registerButton.textContent = originalText;
        registerButton.disabled = false;
        
        if (error.code === "auth/email-already-in-use") {
          showNotification("Email already registered. Switching to login...", false);
          document.getElementById("loginEmail").value = email;
          switchToLogin();
        } else if (error.code === "auth/weak-password") {
          showNotification("Password is too weak. Use at least 6 characters.", false);
        } else if (error.code === "auth/invalid-email") {
          showNotification("Invalid email address.", false);
        } else {
          showNotification("Registration error: " + error.message, false);
        }
      }
    };

    // Forgot password functions
    window.openForgotPasswordModal = function() {
      const email = document.getElementById("loginEmail").value;
      if (email) {
        document.getElementById("resetEmail").value = email;
      }
      document.getElementById("forgotPasswordModal").style.display = "block";
    };

    window.closeModal = function() {
      document.getElementById("forgotPasswordModal").style.display = "none";
      document.getElementById("resetEmail").value = "";
    };

    window.sendResetEmail = async function() {
      const email = document.getElementById("resetEmail").value;
      
      if (!email) {
        showNotification("Please enter your email address", false);
        return;
      }
      
      try {
        await sendPasswordResetEmail(auth, email);
        showNotification("Password reset email sent! Check your inbox and spam folder.");
        closeModal();
      } catch (error) {
        console.error("Reset error:", error.code, error.message);
        if (error.code === "auth/user-not-found") {
          showNotification("No account found with this email", false);
        } else if (error.code === "auth/invalid-email") {
          showNotification("Invalid email address", false);
        } else {
          showNotification("Error: " + error.message, false);
        }
      }
    };

    // Switch forms
    window.switchToRegister = function() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "block";
      document.getElementById("formTitle").innerText = "Register";
    };

    window.switchToLogin = function() {
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("formTitle").innerText = "Login";
    };

    // Toggle password visibility
    window.togglePassword = function(inputId, el) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        el.innerText = "Hide";
      } else {
        input.type = "password";
        el.innerText = "Show";
      }
    };

    // Auto check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("User already logged in:", user.email);
        showNotification("Welcome back! Redirecting to products...");
        setTimeout(() => {
          window.location.href = "products.html";
        }, 1000);
      }
    });

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('forgotPasswordModal');
      if (event.target === modal) {
        closeModal();
      }
    };

    // Enter key support for forms
    document.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') {
          loginUserHandler();
        } else if (document.getElementById('registerForm').style.display !== 'none') {
          registerUserHandler();
        }
      }
    });

    console.log("Firebase authentication system loaded successfully!");
  </script>
</body>
</html>
