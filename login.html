<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor8 - Login</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    .popup {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background: #f0f0f0;
    }
    .popup-content {
      background: white; padding: 2rem; border-radius: 10px; width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: left;
    }
    .popup h2 { text-align: center; margin-bottom: 1rem; }
    .popup input[type="text"], .popup input[type="password"], .popup input[type="email"] {
      width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px;
    }
    .popup button {
      width: 100%; padding: 10px; margin-top: 10px;
      background: #764ba2; color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    .popup button:hover { opacity: 0.9; }
    .toggle-link { color: #667eea; cursor: pointer; font-size: 14px; display: block; margin-top: 10px; text-align: center; }
    .password-box { position: relative; }
    .toggle-password {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 13px; color: #667eea;
    }
    .notification {
      position: fixed; top: 20px; right: 20px; padding: 15px 20px;
      background: #2ecc71; color: white; border-radius: 8px; display: none; z-index: 1000;
    }
    .notification.error { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <div id="loginPopup" class="popup">
    <div class="popup-content">
      <h2 id="formTitle">Login</h2>

      <!-- Login Form -->
      <div id="loginForm">
        <input type="text" id="loginEmail" placeholder="Email">
        <div class="password-box">
          <input type="password" id="loginPassword" placeholder="Password">
          <span class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</span>
        </div>
        <button onclick="loginUserHandler()" id="loginButton">Login</button>
        <span class="toggle-link" onclick="resetPasswordHandler()">Forgot Password?</span>
        <span class="toggle-link" onclick="switchToRegister()">Don't have an account? Register</span>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <div class="password-box">
          <input type="password" id="regPassword" placeholder="Password">
          <span class="toggle-password" onclick="togglePassword('regPassword', this)">Show</span>
        </div>
        <button onclick="registerUserHandler()" id="registerButton">Register</button>
        <span class="toggle-link" onclick="switchToLogin()">Already have an account? Login</span>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendPasswordResetEmail, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKUe5yv0-fMeyMHwXVmUVerGE8nalpJxs",
      authDomain: "decor8-b14e8.firebaseapp.com",
      projectId: "decor8-b14e8",
      storageBucket: "decor8-b14e8.appspot.com",
      messagingSenderId: "301302844702",
      appId: "1:301302844702:web:7376ed27571e8d40cccd0f",
      measurementId: "G-NGJ1DN3SCY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showNotification(message, isSuccess = true) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = isSuccess ? 'notification' : 'notification error';
      notification.style.display = 'block';
      setTimeout(() => { notification.style.display = 'none'; }, 3000);
    }

    // Login function
    window.loginUserHandler = async function() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        // Get username from localStorage
        const storedName = localStorage.getItem("username") || "User";
        showNotification("Welcome " + storedName + "!");

        setTimeout(() => window.location.href = "products.html", 1000);
      } catch (error) {
        if (error.code === "auth/invalid-credential") {
          showNotification("Invalid email or password.", false);
        } else {
          showNotification("Error: " + error.message, false);
        }
      }
    };

    // Register function with auto login
    window.registerUserHandler = async function() {
      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

        // Save name to localStorage
        localStorage.setItem("username", name);

        showNotification("Registration successful! Logging you in...");

        // Auto-login
        await signInWithEmailAndPassword(auth, email, password);

        setTimeout(() => window.location.href = "products.html", 1000);
      } catch (error) {
        if (error.code === "auth/email-already-in-use") {
          showNotification("Email already registered. Please login.", false);
          switchToLogin();
          document.getElementById("loginEmail").value = email;
        } else {
          showNotification("Error: " + error.message, false);
        }
      }
    };

    // Forgot password
    window.resetPasswordHandler = async function() {
      const email = document.getElementById("loginEmail").value;
      if (!email) {
        showNotification("Enter your email first", false);
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showNotification("Password reset email sent. Check your inbox.");
        setTimeout(() => window.location.href = "products.html", 1000);
      } catch (error) {
        if (error.code === "auth/user-not-found") {
          showNotification("No account found with this email", false);
        } else {
          showNotification("Error: " + error.message, false);
        }
      }
    };

    // Switch forms
    window.switchToRegister = function() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "block";
      document.getElementById("formTitle").innerText = "Register";
    };

    window.switchToLogin = function() {
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("formTitle").innerText = "Login";
    };

    // Toggle password
    window.togglePassword = function(inputId, el) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        el.innerText = "Hide";
      } else {
        input.type = "password";
        el.innerText = "Show";
      }
    };

    // Auth state listener (remove debug logs from UI)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // No logs shown to user, only internal
        console.log("User logged in:", user.email);
      }
    });
  </script>
</body>
</html>
