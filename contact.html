<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Decor8</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .contact-section {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 40px;
    }
    .contact-form {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      margin: 20px;
    }
    .contact-form h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .contact-form button {
      width: 100%;
      padding: 12px;
      background: #b5a268;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .contact-form button:hover {
      background: #9a8855;
    }
    .contact-img {
      flex: 1;
      min-width: 300px;
      margin: 20px;
    }
    .contact-img img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    .contact-info {
      background: #b5a268;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .contact-info div {
      margin: 10px 0;
    }
    .contact-info i {
      margin-right: 8px;
    }
    .contact-info a {
      color: white;
      text-decoration: none;
    }
    .contact-info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <section class="contact-section">
    <!-- Contact Form -->
    <div class="contact-form">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <input type="text" name="from_name" placeholder="Enter your Name" required>
        <input type="email" name="reply_to" placeholder="Enter your Email" required>
        <textarea name="message" rows="5" placeholder="Enter your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

    <!-- Image -->
    <div class="contact-img">
    <img src="images/sofa.jpg" alt="Decor8 Contact Image">
    </div>
  </section>

  <!-- Contact Info -->
  <div class="contact-info">
    <div><i class="fas fa-phone"></i> Call Us: <a href="tel:8807648478">8807648478</a>, <a href="tel:8098260354">8098260354</a></div>
    <div><i class="fas fa-envelope"></i> Email: <a href="mailto:manikandan.nithyasri494@gmail.com">manikandan.nithyasri494@gmail.com</a></div>
    <div><i class="fas fa-map-marker-alt"></i> Location: Madurai,Tamilnadu,India.</div>
  </div>

  <script>
    // Init EmailJS
    (function(){
      emailjs.init("4NouW_e35hJLmsz92"); // Your Public Key
    })();

    // Handle form submit
    document.getElementById("contact-form").addEventListener("submit", function(e){
      e.preventDefault();

      emailjs.sendForm("service_s9jyt1m", "template_dtz8ow8", this)
      .then(() => {
        alert("✅ Message sent successfully!");
        this.reset();
      }, (err) => {
        alert("❌ Failed to send: " + JSON.stringify(err));
      });
    });
  </script>

</body>
</html>
