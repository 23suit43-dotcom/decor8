<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Decor8</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .contact-container {
      max-width: 900px;
      margin: 50px auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }
    .contact-img {
      flex: 1;
      min-width: 300px;
      background: url('images/sofa.jpg') center/cover no-repeat;
    }
    .contact-form {
      flex: 1;
      padding: 30px;
    }
    .contact-form h2 {
      text-align: center;
      color: #6a1b9a;
      margin-bottom: 15px;
    }
    .contact-form p {
      text-align: center;
      font-style: italic;
      margin-bottom: 25px;
      color: #444;
    }
    .contact-form input, 
    .contact-form textarea {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    .contact-form button {
      width: 100%;
      padding: 14px;
      background: #c5b358;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .contact-form button:hover {
      background: #b39b4c;
    }
    .info-section {
      text-align: center;
      margin: 40px 20px;
    }
    .info-section h3 {
      color: #6a1b9a;
      margin-bottom: 10px;
    }
    .social-icons {
      margin-top: 15px;
    }
    .social-icons a {
      text-decoration: none;
      margin: 0 10px;
      font-size: 24px;
      color: #6a1b9a;
      transition: 0.3s;
    }
    .social-icons a:hover {
      color: #c5b358;
    }
  </style>
  <!-- FontAwesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="contact-container">
    <div class="contact-img"></div>
    <div class="contact-form">
      <h2>Contact Us</h2>
      <p>"Let’s Decorate Your Dream Together"</p>
      <form onsubmit="submitContact(event)">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <div class="info-section">
    <h3>📧 Email</h3>
    <p>nandhanashri2006@gmail.com</p>
    <p>manikandan.nithyasri494@gmail.com</p>

    <h3>📍 Location</h3>
    <p>Madurai, Tamil Nadu, India</p>

    <div class="social-icons">
      <a href="mailto:nandhanashri2006@gmail.com"><i class="fas fa-envelope"></i></a>
      <a href="https://wa.me/919876543210" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://instagram.com/your_instagram" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>
  </div>

  <!-- Firebase & Firestore -->
  <script type="module">
    import { db } from './firebase.js';
    import { collection, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    async function submitContact(e){
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      try {
        await addDoc(collection(db, "contacts"), {
          name: name,
          email: email,
          message: message,
          createdAt: serverTimestamp()
        });
        alert("✅ Your message has been sent successfully!");
        e.target.reset();
      } catch (err) {
        console.error("Error saving contact:", err);
        alert("❌ Failed to send message. Try again.");
      }
    }

    window.submitContact = submitContact;
  </script>

</body>
</html>
