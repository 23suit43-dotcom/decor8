<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Decor8</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
    }

    .contact-wrapper {
      display: flex;
      max-width: 1000px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .contact-form {
      flex: 1;
      padding: 40px;
    }

    .contact-form h2 {
      margin-bottom: 20px;
      font-size: 26px;
      color: #333;
      text-align: center;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-bottom: 2px solid #ddd;
      font-size: 15px;
      outline: none;
    }

    .contact-form button {
      width: 100%;
      padding: 12px;
      background: #c5b358;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background: #b39b4c;
    }

    .contact-img {
      flex: 1;
      background: url("images/your-image.jpg") center/cover no-repeat;
    }

    .contact-info {
      display: flex;
      justify-content: space-around;
      background: #c5b358;
      color: #fff;
      padding: 20px;
      flex-wrap: wrap;
      text-align: center;
    }

    .contact-info div {
      margin: 10px;
      flex: 1;
      min-width: 200px;
    }

    .contact-info i {
      font-size: 22px;
      margin-bottom: 8px;
      display: block;
    }

    .contact-info a {
      color: #fff;
      text-decoration: none;
    }
  </style>
  <!-- FontAwesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Main Contact Section -->
  <div class="contact-wrapper">
    <div class="contact-form">
      <h2>Contact Us</h2>
      <form onsubmit="submitContact(event)">
        <input type="text" id="name" placeholder="Enter your Name" required>
        <input type="email" id="email" placeholder="Enter a valid email address" required>
        <textarea id="message" placeholder="Enter your message" rows="5" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
    <div class="contact-img"></div>
  </div>

  <!-- Info Section -->
  <div class="contact-info">
    <div>
      <i class="fas fa-phone"></i>
      <h4>Call Us</h4>
      <p><a href="tel:+919876543210">+91 98765 43210</a></p>
      <p><a href="tel:+911234567890">+91 12345 67890</a></p>
    </div>
    <div>
      <i class="fas fa-map-marker-alt"></i>
      <h4>Location</h4>
      <p><a href="https://goo.gl/maps/yourmaplink" target="_blank">Madurai, Tamil Nadu, India</a></p>
    </div>
    <div>
      <i class="fas fa-envelope"></i>
      <h4>Email</h4>
      <p><a href="mailto:nandhanashri2006@gmail.com">nandhanashri2006@gmail.com</a></p>
      <p><a href="mailto:manikandan.nithyasri494@gmail.com">manikandan.nithyasri494@gmail.com</a></p>
    </div>
    <div>
      <i class="fas fa-clock"></i>
      <h4>Hours</h4>
      <p>Mon - Fri: 11am - 8pm</p>
      <p>Sat - Sun: 6am - 8pm</p>
    </div>
  </div>

  <!-- Firebase + Firestore + EmailJS -->
  <script type="module">
    import { db } from './firebase.js';
    import { collection, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    async function submitContact(e){
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      try {
        // Save in Firestore
        await addDoc(collection(db, "contacts"), {
          name, email, message,
          createdAt: serverTimestamp()
        });

        // Send Email using EmailJS (free & easy)
        emailjs.send("your_service_id", "your_template_id", {
          from_name: name,
          from_email: email,
          message: message
        }, "your_public_key");

        alert("✅ Message sent successfully!");
        e.target.reset();
      } catch (err) {
        console.error("Error:", err);
        alert("❌ Failed to send message. Try again.");
      }
    }
    window.submitContact = submitContact;
  </script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("your_public_key"); // replace with EmailJS Public Key
    })();
  </script>

</body>
</html>
